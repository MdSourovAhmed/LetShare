

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  LetsShare — Docker Compose                                              ║
# ║                                                                          ║
# ║  Two profiles:                                                           ║
# ║                                                                          ║
# ║  dev  →  docker compose --profile dev up                                 ║
# ║          Starts all four containers with HMR / nodemon.                  ║
# ║          Source is bind-mounted — edit files on host, see changes live.  ║
# ║                                                                          ║
# ║  prod →  docker compose --profile prod up --build                        ║
# ║          Builds optimised images. Frontend: nginx. Backend: node prod.   ║
# ║          Set env vars in .env before running.                            ║
# ║                                                                          ║
# ║  You can also run a single app's profile:                                ║
# ║    docker compose --profile dev-internet up                              ║
# ║    docker compose --profile dev-lan up                                   ║
# ║                                                                          ║
# ║  mDNS note: The LAN backend needs network_mode: host on Linux to        ║
# ║  advertise letshare.local. On macOS/Windows use native node instead.     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INTERNET APP
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Internet backend — dev ─────────────────────────────────────────────────
  internet-backend-dev:
    profiles: [dev, dev-internet]
    build:
      context: .                                  # build context is monorepo root
      dockerfile: apps/internet/backend/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./apps/internet/backend:/app/apps/internet/backend  # live reload
      - ./packages/core:/app/packages/core                  # shared core — server.js imports metricsWriter.js from here
      - internet_backend_modules:/app/node_modules          # container's node_modules
    environment:
      PORT: 3001
      CORS_ORIGIN: "*"
      INFLUX_URL: "${INFLUX_URL:-http://influxdb:8086}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-}"
      INFLUX_ORG: "${INFLUX_ORG:-letshare}"
      INFLUX_BUCKET: "internet_transfers"
      METRICS_LOG_FILE: "./logs/internet-transfers.jsonl"
    networks: [letshare-net]
    restart: unless-stopped

  # ── Internet frontend — dev ────────────────────────────────────────────────
  internet-frontend-dev:
    profiles: [dev, dev-internet]
    build:
      context: .
      dockerfile: apps/internet/frontend/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/internet/frontend:/app/apps/internet/frontend  # HMR source
      - ./packages/core:/app/packages/core                    # shared core
      - internet_frontend_modules:/app/node_modules
    environment:
      VITE_BACKEND_URL: ""    # empty = Vite proxy handles /socket.io → backend
    depends_on:
      - internet-backend-dev
    networks: [letshare-net]
    restart: unless-stopped

  # ── Internet backend — prod ────────────────────────────────────────────────
  internet-backend-prod:
    profiles: [prod, prod-internet]
    build:
      context: .
      dockerfile: apps/internet/backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      # Only the logs dir — unlike backend-dev, prod doesn't bind-mount the
      # whole source tree, so this needs its own mount or the JSONL log
      # would only exist inside the ephemeral container.
      - ./apps/internet/backend/logs:/app/apps/internet/backend/logs
    environment:
      PORT: 3001
      CORS_ORIGIN: "${INTERNET_CORS_ORIGIN:-*}"
      INFLUX_URL: "${INFLUX_URL:-http://influxdb:8086}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-}"
      INFLUX_ORG: "${INFLUX_ORG:-letshare}"
      INFLUX_BUCKET: "internet_transfers"
      METRICS_LOG_FILE: "./logs/internet-transfers.jsonl"
    networks: [letshare-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Internet frontend — prod (nginx) ───────────────────────────────────────
  internet-frontend-prod:
    profiles: [prod, prod-internet]
    build:
      context: .
      dockerfile: apps/internet/frontend/Dockerfile
      args:
        # Baked into JS bundle — must be the URL browsers use to reach the backend
        VITE_BACKEND_URL: "${VITE_BACKEND_URL:-}"
    ports:
      - "80:80"
    depends_on:
      internet-backend-prod:
        condition: service_healthy
    networks: [letshare-net]
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # LAN APP
  # ═══════════════════════════════════════════════════════════════════════════

  # ── LAN backend — dev ─────────────────────────────────────────────────────
  lan-backend-dev:
    profiles: [dev, dev-lan]
    build:
      context: .
      dockerfile: apps/lan/backend/Dockerfile.dev
    ports:
      - "3002:3002"
    volumes:
      - ./apps/lan/backend:/app/apps/lan/backend
      - ./packages/core:/app/packages/core   # shared core — server.js imports metricsWriter.js from here
      - lan_backend_modules:/app/node_modules
    environment:
      PORT: 3002
      INFLUX_URL: "${INFLUX_URL:-http://influxdb:8086}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-}"
      INFLUX_ORG: "${INFLUX_ORG:-letshare}"
      INFLUX_BUCKET: "lan_transfers"
      METRICS_LOG_FILE: "./logs/lan-transfers.jsonl"
    # network_mode: host    # ← Uncomment on Linux for real mDNS (letshare.local)
    #                         # On macOS/Windows, run the backend natively instead.
    networks: [letshare-net]
    restart: unless-stopped

  # ── LAN frontend — dev ────────────────────────────────────────────────────
  lan-frontend-dev:
    profiles: [dev, dev-lan]
    build:
      context: .
      dockerfile: apps/lan/frontend/Dockerfile.dev
    ports:
      - "5174:5174"
    volumes:
      - ./apps/lan/frontend:/app/apps/lan/frontend
      - ./packages/core:/app/packages/core
      - lan_frontend_modules:/app/node_modules
    depends_on:
      - lan-backend-dev
    networks: [letshare-net]
    restart: unless-stopped

  # ── LAN backend — prod ────────────────────────────────────────────────────
  lan-backend-prod:
    profiles: [prod, prod-lan]
    build:
      context: .
      dockerfile: apps/lan/backend/Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./apps/lan/backend/logs:/app/apps/lan/backend/logs
    environment:
      PORT: 3002
      INFLUX_URL: "${INFLUX_URL:-http://influxdb:8086}"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-}"
      INFLUX_ORG: "${INFLUX_ORG:-letshare}"
      INFLUX_BUCKET: "lan_transfers"
      METRICS_LOG_FILE: "./logs/lan-transfers.jsonl"
    # network_mode: host    # ← Uncomment on Linux for mDNS
    networks: [letshare-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── LAN frontend — prod (nginx) ────────────────────────────────────────────
  lan-frontend-prod:
    profiles: [prod, prod-lan]
    build:
      context: .
      dockerfile: apps/lan/frontend/Dockerfile
    ports:
      - "8080:80"       # port 8080 on host → 80 inside container
    depends_on:
      lan-backend-prod:
        condition: service_healthy
    networks: [letshare-net]
    restart: unless-stopped

# ── Observability stack — opt-in via `docker compose --profile observability up` ──
# Entirely separate from the app profiles above. Both backends already write
# to InfluxDB when INFLUX_TOKEN is set (see each service's environment block);
# this just gives you somewhere for those writes to land, plus Grafana Cloud
# to view them. Two buckets — internet and lan never share a query.
#
# Instead of a local Grafana, we run the Grafana Cloud Private Data Source
# Connect (PDC) agent. It opens a secure tunnel so your Grafana Cloud stack
# can query the private InfluxDB without exposing port 8086 publicly.
# Required env vars (set in .env or the shell):
#   GCLOUD_PDC_SIGNING_TOKEN   – token with pdc-signing:write scope
#   GCLOUD_HOSTED_GRAFANA_ID   – your Hosted Grafana stack ID
#   GCLOUD_PDC_CLUSTER         – e.g. prod-us-central-0 (shown in Cloud UI)
#
# Logs (both backends' JSONL files) ship to Grafana Cloud Loki via Alloy —
# separate concern from PDC (PDC is query-side, for InfluxDB; Alloy is
# push-side, for logs), so it's its own service and its own set of secrets:
#   GRAFANA_CLOUD_LOKI_URL / _USER / _API_KEY  – Cloud → Connections → Loki

  influxdb:
    profiles: [observability]
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-letshare-admin}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-letshare}
      DOCKER_INFLUXDB_INIT_BUCKET: internet_transfers # 2nd bucket created below
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks: [letshare-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: influxdb's own init only creates ONE bucket at first boot, so
  # this creates lan_transfers, then exits. Safe to re-run (errors if the
  # bucket already exists, which is fine — the container just exits non-zero
  # and compose moves on).
  influxdb-init:
    profiles: [observability]
    image: influxdb:2
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [letshare-net]
    entrypoint: >
      sh -c "influx bucket create --name lan_transfers
      --org ${INFLUX_ORG:-letshare} --token ${INFLUX_TOKEN}
      --host http://influxdb:8086 || true"

  # Grafana Cloud PDC agent — tunnels private data sources (InfluxDB) to
  # your Grafana Cloud stack. No local Grafana UI; use grafana.com instead.
  pdc-agent:
    profiles: [observability]
    image: grafana/pdc-agent:latest
    environment:
      GCLOUD_PDC_SIGNING_TOKEN: ${GCLOUD_PDC_SIGNING_TOKEN}
      GCLOUD_HOSTED_GRAFANA_ID: ${GCLOUD_HOSTED_GRAFANA_ID}
      GCLOUD_PDC_CLUSTER: ${GCLOUD_PDC_CLUSTER}
    # Optional: expose metrics (default :8090) if you want to scrape them
    # ports:
    #   - "8090:8090"
    networks: [letshare-net]
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy

  # Ships both backends' JSONL logs to Grafana Cloud Loki — reads the exact
  # files METRICS_LOG_FILE already writes in each backend's dev volume
  # mount, nothing new to configure on the backend side. Config lives in
  # ./observability/alloy-config.alloy (shared, unchanged, with
  # docker-compose.deploy.yml).
  # alloy:
  #   profiles: [observability]
  #   image: grafana/alloy:latest
  #   restart: unless-stopped
  #   command:
  #     - run
  #     - /etc/alloy/config.alloy
  #     - --storage.path=/var/lib/alloy/data
  #   environment:
  #     GRAFANA_CLOUD_LOKI_URL: "${GRAFANA_CLOUD_LOKI_URL}"
  #     GRAFANA_CLOUD_LOKI_USER: "${GRAFANA_CLOUD_LOKI_USER}"
  #     GRAFANA_CLOUD_LOKI_API_KEY: "${GRAFANA_CLOUD_LOKI_API_KEY}"
  #   volumes:
  #     - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
  #     - ./apps/internet/backend/logs:/var/log/letshare/internet:ro
  #     - ./apps/lan/backend/logs:/var/log/letshare/lan:ro
  #     - alloy_data:/var/lib/alloy/data
  #   networks: [letshare-net]

# ── Named volumes (node_modules stay inside containers) ──────────────────────
# These prevent the host's node_modules (or absence of them) from leaking
# into the container. Each container manages its own dependency tree.
volumes:
  internet_backend_modules:
  internet_frontend_modules:
  lan_backend_modules:
  lan_frontend_modules:
  influxdb_data:
  alloy_data:

networks:
  letshare-net:
    driver: bridge
