apiVersion: 1

# One datasource per app, each pinned to that app's own bucket. There is no
# shared/combined datasource — a dashboard built on "InfluxDB - Internet"
# can only query internet_transfers, and likewise for LAN.
datasources:
  - name: InfluxDB - Internet
    uid: influxdb-internet
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: internet_transfers
    secureJsonData:
      token: ${INFLUX_TOKEN}

  - name: InfluxDB - LAN
    uid: influxdb-lan
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: lan_transfers
    secureJsonData:
      token: ${INFLUX_TOKEN}
