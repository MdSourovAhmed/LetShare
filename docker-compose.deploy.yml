#     environment:
#       DOMAIN: "${DOMAIN}"
#     volumes:
#       - ./Caddyfile:/etc/caddy/Caddyfile:ro
#       - caddy_data:/data       # certificates — must persist across restarts, or you'll hit Let's Encrypt's rate limit
#       - caddy_config:/config
#     depends_on:
#       - internet-frontend-prod
#     networks: [letshare-deploy-net]

#   internet-backend-prod:
#     image: ghcr.io/${GHCR_OWNER}/letshare-internet-backend:latest
#     restart: unless-stopped
#     # No ports published — only reachable from other containers on
#     # letshare-deploy-net (nginx, inside internet-frontend-prod, proxies to
#     # it by service name). Smaller attack surface: the backend is simply
#     # not addressable from the public internet at all.
#     environment:
#       PORT: 3001
#       CORS_ORIGIN: "${INTERNET_CORS_ORIGIN}"
#       INFLUX_URL: "${INFLUX_URL:-http://influxdb:8086}"
#       INFLUX_TOKEN: "${INFLUX_TOKEN:-}"
#       INFLUX_ORG: "${INFLUX_ORG:-letshare}"
#       INFLUX_BUCKET: "internet_transfers"
#       METRICS_LOG_FILE: "./logs/internet-transfers.jsonl"
#     volumes:
#       - ./logs/internet-backend:/app/apps/internet/backend/logs
#     networks: [letshare-deploy-net]
#     healthcheck:
#       test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
#       interval: 15s
#       timeout: 5s
#       retries: 3

#   internet-frontend-prod:
#     image: ghcr.io/${GHCR_OWNER}/letshare-internet-frontend:latest
#     restart: unless-stopped
#     # No ports published either — Caddy is the only public entry point.
#     # This name must match the proxy_pass targets baked into
#     # apps/internet/frontend/nginx.conf (/api/, /socket.io/) at build time.
#     depends_on:
#       - internet-backend-prod
#     networks: [letshare-deploy-net]

#   # ── TURN server (coturn) ─────────────────────────────────────────────────
#   # Fixes: "No TURN server configured" warning in the browser console.
#   # STUN (already configured, no setup needed) gets most peers connected
#   # directly. It fails for peers behind symmetric NAT or a restrictive
#   # firewall (common on corporate/mobile networks) — those need a relay,
#   # which is what this is. Without it, that subset of transfers just never
#   # connects, silently.
#   #
#   # host networking, not published ports: coturn needs a wide UDP port
#   # range (min-port..max-port below) for media relay. Publishing each of
#   # those individually is unnecessary — host networking exposes them all
#   # at once and also avoids Docker's NAT hiding the VPS's real public IP,
#   # which coturn needs to advertise correctly in ICE candidates.
#   #
#   # Static long-term credentials (TURN_USERNAME/TURN_CREDENTIAL below) must
#   # match VITE_TURN_USERNAME/VITE_TURN_CREDENTIAL used at frontend build
