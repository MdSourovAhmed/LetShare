server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ───────────────────────────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html so
    # React Router's client-side navigation works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Long-lived asset caching ──────────────────────────────────────────────
    # Vite fingerprints all JS/CSS filenames with a content hash, so we can
    # safely cache them for 1 year. The browser only re-fetches when the hash
    # changes (i.e. when the code changes).
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}