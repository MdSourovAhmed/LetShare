server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ───────────────────────────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html so
    # React Router's client-side navigation works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Metrics beacon ─────────────────────────────────────────────────────────
    # VITE_METRICS_ENDPOINT is baked in as the relative path /api/metrics, so
    # sendBeacon() posts to this nginx's own origin. Without this block it fell
    # through to the SPA fallback above and writeMetrics() on the backend never
    # ran. internet-backend-prod is the Docker Compose service name — resolved
    # via the letshare-net network's built-in DNS, not "localhost".
    location /api/ {
        proxy_pass http://internet-backend-prod:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.io signaling ──────────────────────────────────────────────────
    # Same-origin proxying, same reasoning as /api/ above — this also fixes
    # mixed-content: once the page is served over HTTPS (see Caddy in
    # docker-compose.deploy.yml), a plain http:// or ws:// backend
    # connection would be blocked by the browser outright. Requires
    # VITE_BACKEND_URL="" at build time so socket.io-client connects
    # same-origin instead of to a separate absolute URL.
    location /socket.io/ {
        proxy_pass http://internet-backend-prod:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Long-lived asset caching ──────────────────────────────────────────────
    # Vite fingerprints all JS/CSS filenames with a content hash, so we can
    # safely cache them for 1 year. The browser only re-fetches when the hash
    # changes (i.e. when the code changes).
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}